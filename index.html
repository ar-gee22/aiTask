<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>SNAKE</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info">The Score is = 0</p>
    <button id ="restartB">RESTART</button>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let turnedThisTick = false;
        let gameOver = false;
        let speed = 150;
        let intervalId;
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        const moveSnake = () => {
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if ((head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) || 
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                
                    gameOver = true;
                    document.getElementById("info").textContent = "Game Over! Score = " + score;
                    return;
            };

            


            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;

                if (score % 3 === 0 && speed > 70) {
                    speed -= 10;
                    clearInterval(intervalId);
                    intervalId = setInterval(gameLoop, speed); 
                }


                document.getElementById("info").textContent = "The Score is = " + score;
                
                do {
                    food = { 
                        x: Math.floor(Math.random() * tileCount), 
                        y: Math.floor(Math.random() * tileCount)
                    };
                } while (snake.some(segment => segment.x === food.x && segment.y === food.y));

            } else {
                snake.pop();
            }
        };

        const gameLoop = () => {
            if (gameOver) return;


            moveSnake();
            drawGame();
            turnedThisTick = false;
        };
        intervalId = setInterval(gameLoop, speed);


        // Step 2: Keyboard controls (arrow keys)
        document.addEventListener("keydown", (event) => {

            if (turnedThisTick == true) {
                return;
            };

            switch (event.key) {
                case "ArrowUp": 
                    if (direction.y === 0) {
                        direction = { 
                            x:0,
                            y: -1
                        }; turnedThisTick = true;
                    };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) {
                    direction = {
                            x: 0,
                            y: 1
                        }; turnedThisTick = true;
                    };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) {
                        direction = {
                            x: -1,
                            y: 0
                        }; turnedThisTick = true;
                    };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) {
                        direction = {
                            x: 1,
                            y: 0
                        }; turnedThisTick = true;
                    };
                    break;
                }
            });
        
        // Restart

        const restartB = document.getElementById("restartB");
        restartB.addEventListener("click", () => {
            snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            turnedThisTick = false;
            gameOver = false;
            food = { x: 15, y: 15 };
            score = 0;

            speed = 150;
            clearInterval(intervalId);
            intervalId = setInterval(gameLoop, speed);

            document.getElementById("info").textContent = "The Score is = " + score;
            drawGame();
        });



        // Step 3: Eating and growing
        


        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
